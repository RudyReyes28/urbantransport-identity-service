# ==================== Database ====================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# ==================== Bootstrap admin ====================
identity.bootstrap-admin.email=${BOOTSTRAP_ADMIN_EMAIL}
identity.bootstrap-admin.password=${BOOTSTRAP_ADMIN_PASSWORD}
identity.bootstrap-admin.full-name=${BOOTSTRAP_ADMIN_NAME:Administrador del Sistema}

# ==================== JWT ====================
# identity.jwt.private-key-path=${JWT_PRIVATE_KEY_PATH}

# ==================== Kafka ====================
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS}

# ==================== Internal API ====================
identity.internal.api-key=${INTERNAL_API_KEY}

# ==================== Logging ====================
logging.level.root=INFO