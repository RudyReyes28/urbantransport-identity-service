# ==========================================
# BASE DE DATOS EN MEMORIA (H2)
# ==========================================
spring.datasource.url=jdbc:h2:mem:identity_test_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate crea las tablas en H2 a partir de las entidades (@Entity)
spring.jpa.hibernate.ddl-auto=create-drop

# Desactivamos Flyway en H2 porque los scripts V1..V3 usan sintaxis nativa de PostgreSQL
spring.flyway.enabled=false

# ==========================================
# KAFKA Y SCHEDULING
# ==========================================
spring.kafka.listener.auto-startup=false
spring.kafka.admin.auto-create=false
spring.kafka.bootstrap-servers=localhost:9092
spring.task.scheduling.enabled=false

# ==========================================
# PROPIEDADES DEL MICROSERVICIO
# ==========================================
identity.jwt.issuer=identity-test
identity.jwt.access-token-ttl=15m
identity.jwt.refresh-token-ttl=7d
identity.jwt.private-key-path=

identity.internal.api-key=test-internal-api-key

identity.bootstrap-admin.email=admin@test.com
identity.bootstrap-admin.password=
identity.bootstrap-admin.full-name=Test Admin

identity.kafka.events-topic=identity.events.test
identity.kafka.customer-events-topic=customer.events.test
identity.kafka.fleet-events-topic=fleet.events.test