spring.application.name=identity-service
server.port=${SERVER_PORT:8081}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/identity_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:1234}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false




# ==================== Identity Service Configuration ====================
identity.bootstrap-admin.email=${BOOTSTRAP_ADMIN_EMAIL:admin@urbantransport.com}
identity.bootstrap-admin.password=${BOOTSTRAP_ADMIN_PASSWORD:admin123}
identity.bootstrap-admin.full-name=${BOOTSTRAP_ADMIN_NAME:Administrador del Sistema}


identity.jwt.issuer=urbantransport-identity
identity.jwt.access-token-ttl=15m
identity.jwt.private-key-path=${JWT_PRIVATE_KEY_PATH:}
identity.jwt.refresh-token-ttl=7d


management.endpoints.web.exposure.include=health,info