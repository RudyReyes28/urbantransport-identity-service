spring.application.name=identity-service
server.port=${SERVER_PORT:8081}
spring.config.import=optional:file:.env[.properties]
spring.profiles.active=dev

#==================== Database Configuration ====================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/identity_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:1234}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false


# ==================== Identity Service Configuration ====================
identity.bootstrap-admin.email=${BOOTSTRAP_ADMIN_EMAIL:admin@urbantransport.com}
identity.bootstrap-admin.password=${BOOTSTRAP_ADMIN_PASSWORD:admin123}
identity.bootstrap-admin.full-name=${BOOTSTRAP_ADMIN_NAME:Administrador del Sistema}


identity.jwt.issuer=urbantransport-identity
identity.jwt.access-token-ttl=15m
identity.jwt.private-key-path=${JWT_PRIVATE_KEY_PATH:}
identity.jwt.refresh-token-ttl=7d

identity.password-setup.url=${PASSWORD_SETUP_URL:http://localhost:4200/set-password}
identity.password-setup.token-ttl=48h


# ==================== Kafka Configuration ====================
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.block.ms=5000
spring.kafka.consumer.group-id=identity-service
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.auto-offset-reset=earliest

identity.kafka.events-topic=identity-events
identity.kafka.customer-events-topic=customer-events
identity.kafka.fleet-events-topic=fleet-events
identity.outbox.poll-interval-ms=1000

# Clave compartida con customer-service (obligatoria para /internal/**)
identity.internal.api-key=${INTERNAL_API_KEY:bgrYnhNTQaQVy1sxCjpRorn09NdsI2qFCnMCFVvhJHg=}

management.endpoints.web.exposure.include=health,info