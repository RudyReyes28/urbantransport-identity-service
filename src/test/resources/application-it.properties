# Perfil de las pruebas de integración: PostgreSQL embebido real + Kafka embebido.
# Puertos, tópicos y credenciales de prueba se inyectan desde AbstractIdentityIT.
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

identity.jwt.issuer=identity-it
identity.jwt.access-token-ttl=15m
identity.jwt.refresh-token-ttl=7d
identity.jwt.private-key-path=

identity.outbox.poll-interval-ms=200

spring.kafka.consumer.group-id=identity-it
spring.kafka.consumer.auto-offset-reset=earliest